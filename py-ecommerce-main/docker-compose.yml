services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
  db:
    image: mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_PORT=3306
    ports:
      - ${DB_PORT}:3306
    volumes:
      - ./mysql_data:/var/lib/mysql
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=mysql${DB_URL}
    volumes:
      - ./api:/app
  product:
    build:
      context: .
      dockerfile: ./services/product/Dockerfile
    restart: always
    ports:
      - "8001:8001"
    depends_on:
      - db
      - category
    environment:
      - DATABASE_URL=mysql${DB_URL}
      - CATEGORY_URL=http://127.0.0.1:8002
    env_file:
      - .env
    volumes:
      - ./services/product:/app
  category:
    build:
      context: .
      dockerfile: ./services/category/Dockerfile
    restart: always
    ports:
      - "8002:8002"
    depends_on:
      - db
    environment:
      - DATABASE_URL=mysql${DB_URL}
    env_file:    
      - .env  
    volumes:
      - ./services/category:/app
  user:
    build:
      context: .
      dockerfile: ./services/user/Dockerfile
    restart: always
    ports:
      - "8003:8003"
    depends_on:
      - db
    environment:
      - DATABASE_URL=mysql${DB_URL}
    env_file:    
      - .env  
    volumes:
      - ./services/user:/app
  order:
    build:
      context: .
      dockerfile: ./services/order/Dockerfile
    restart: always
    ports:
      - "8004:8004"
    depends_on:
      - db
    environment:
      - DATABASE_URL=mysql${DB_URL}
    env_file:    
      - .env  
    volumes:
      - ./services/order:/app